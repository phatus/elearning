name: Deploy Elearning to aaPanel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to aaPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop_on_error: true
          script: |
            echo "🚀 Starting Automated Deployment on aaPanel..."
            cd /www/wwwroot/elearning
            
            echo "1. Git Safe Directory & Pull..."
            git config --global --add safe.directory /www/wwwroot/elearning
            git pull origin main
            
            echo "2. Cleaning cache & installing dependencies..."
            rm -f /www/wwwroot/package-lock.json /www/wwwroot/package.json
            npm cache clean --force
            rm -rf node_modules package-lock.json .next
            npm install --prefix /www/wwwroot/elearning
            
            echo "3. Prisma Schema & DB Push..."
            npx prisma generate
            npx prisma db push
            
            echo "4. Building Next.js Application..."
            npm run build
            
            echo "5. Restarting Process via PM2..."
            pm2 restart elearning || pm2 start ecosystem.config.js
            
            echo "✅ Deployment Successful!"
