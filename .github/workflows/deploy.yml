name: Deploy to Live Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      NODE_OPTIONS: "--no-deprecation"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy .env from production
        run: |
          if [ -f "/www/wwwroot/elearning/.env" ]; then
            cp /www/wwwroot/elearning/.env .
          fi

      - name: Clean & Install Dependencies
        run: |
          rm -rf node_modules package-lock.json .next
          npm install

      - name: Generate Prisma Client
        run: |
          if [ -f .env ]; then
            export $(grep -v '^#' .env | xargs)
          fi
          ./node_modules/.bin/prisma generate || npx prisma generate

      - name: Backup Database
        run: |
          echo "Creating database backup..."

          if ! command -v pg_dump &> /dev/null; then
            echo "⚠️  pg_dump not found. Skipping backup."
            exit 0
          fi

          if [ -f .env ]; then
            export $(grep -v '^#' .env | xargs)
          fi
          
          DB_URL="${DIRECT_URL:-$DATABASE_URL}"
          
          if [ -z "$DB_URL" ]; then
            echo "⚠️  Database URL not found in .env. Skipping backup."
          else
            BACKUP_DIR=".backup/db"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/backup-$(date +%Y%m%d-%H%M%S).sql"

            echo "📦 Creating backup at $BACKUP_FILE..."
            if pg_dump --no-owner --no-acl "$DB_URL" > "$BACKUP_FILE" 2>&1; then
              echo "✅ Backup created: $(ls -lh "$BACKUP_FILE")"

              if [ -w "/www/backup" ]; then
                sudo mkdir -p "/www/backup/elearning/db" 2>/dev/null || true
                if [ -d "/www/backup/elearning/db" ]; then
                  sudo cp "$BACKUP_FILE" "/www/backup/elearning/db/"
                  echo "✅ Backup also saved to /www/backup/elearning/db/"
                fi
              fi

              ls -t "$BACKUP_DIR"/backup-*.sql 2>/dev/null | tail -n +8 | xargs -r rm
              echo "✅ Old backups cleaned (keeping last 7 in $BACKUP_DIR)"
            else
              echo "❌ pg_dump failed. Check DATABASE_URL and connectivity."
              rm -f "$BACKUP_FILE"
            fi
          fi

      - name: Run Database Migrations
        run: |
          if [ -f .env ]; then
            export $(grep -v '^#' .env | xargs)
            ./node_modules/.bin/prisma db push || npx prisma db push
          else
            echo "⚠️  .env file not found. Skipping db push."
          fi

      - name: Build Application
        run: |
          if [ -f .env ]; then
            export $(grep -v '^#' .env | xargs)
            npm run build
          else
            echo "❌ .env file not found. Build may fail."
            npm run build
          fi

      - name: Deploy to Production
        run: |
          # 1. Sync standalone core files to root
          sudo /usr/bin/rsync -rltz --inplace --chown=www:www .next/standalone/ /www/wwwroot/elearning/

          # 2. Sync prisma schema (for database access)
          sudo /usr/bin/rsync -rltz --inplace --chown=www:www prisma/ /www/wwwroot/elearning/prisma/

          # 3. Next.js standalone expects .next/static and public in the same folder as server.js
          sudo /usr/bin/mkdir -p /www/wwwroot/elearning/.next
          sudo /usr/bin/rsync -rltz --inplace --delete --chown=www:www .next/static/ /www/wwwroot/elearning/.next/static/
          sudo /usr/bin/rsync -rltz --inplace --delete --exclude 'uploads' --chown=www:www public/ /www/wwwroot/elearning/public/

      - name: Restart Application
        run: |
          cd /www/wwwroot/elearning
          NODE_ENV=production NODE_OPTIONS="--no-deprecation" pm2 restart elearning || NODE_ENV=production NODE_OPTIONS="--no-deprecation" pm2 start server.js --name "elearning" --node-args="--no-deprecation"
